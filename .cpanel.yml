---
# Deploy HostGator (cPanel > Git Version Control).
#
# ATENCAO ao DEPLOYPATH abaixo. Nesta conta, /public_html NAO e o site da Vegas:
# ele e o document root do dominio principal e do link.riquelmevegas.com.br.
# Cada dominio tem sua propria pasta (padrao: $HOME/<dominio>). Confirme o
# document root de vegasaceleradora.com.br em cPanel > Dominios antes de publicar.
#
# Tudo que vai para o ar esta em public/ — nada fora dela e copiado,
# entao src/, export/, build.py e .git nunca chegam ao servidor.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/vegasaceleradora.com.br
    - /bin/mkdir -p "$DEPLOYPATH"
    - /bin/cp -R -f public/. "$DEPLOYPATH/"
    # Carimbo de publicacao. Serve para responder, do navegador, a pergunta que
    # nenhuma consulta feita daqui responde: o que o dominio serve e o que este
    # deploy escreveu, ou e uma copia antiga em outra pasta?
    # Abra https://vegasaceleradora.com.br/deploy-info.txt — se nao existir, ou
    # se a data for antiga, o DEPLOYPATH acima NAO e o document root do dominio.
    - /bin/date -u +"publicado em %Y-%m-%dT%H:%M:%SZ" > "$DEPLOYPATH/deploy-info.txt"
    - /bin/echo "destino  $DEPLOYPATH" >> "$DEPLOYPATH/deploy-info.txt"
    - /bin/grep -c "sit_6c66a1f9deba" "$DEPLOYPATH/index.html" | /bin/sed "s/^/tags do coletor no index.html  /" >> "$DEPLOYPATH/deploy-info.txt" || /bin/echo "tags do coletor no index.html  0" >> "$DEPLOYPATH/deploy-info.txt"
    # Tambem no log do cPanel, para quem estiver olhando a tela do deploy.
    - /bin/cat "$DEPLOYPATH/deploy-info.txt"
