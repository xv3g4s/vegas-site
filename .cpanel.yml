---
# Deploy HostGator (cPanel > Git Version Control).
#
# ATENCAO ao DEPLOYPATH abaixo. Nesta conta, /public_html NAO e o site da Vegas:
# ele e o document root do dominio principal e do link.riquelmevegas.com.br.
# Cada dominio tem sua propria pasta (padrao: $HOME/<dominio>). Confirme o
# document root de vegasaceleradora.com.br em cPanel > Dominios antes de publicar.
#
# Tudo que vai para o ar esta em public/ — nada fora dela e copiado,
# entao src/, export/, build.py e .git nunca chegam ao servidor.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/vegasaceleradora.com.br
    - /bin/mkdir -p "$DEPLOYPATH"
    - /bin/cp -R -f public/. "$DEPLOYPATH/"
